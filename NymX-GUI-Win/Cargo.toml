[package]
name = "nymx"
version = "0.1.3"
edition = "2021"
authors = ["Ch1ffr3punk"]
description = "NymX - Anonymous data exchange leveraging SURBs via the Nym Mixnet"
license = "Apache 2.0"

[dependencies]
nym-sdk = "1.21.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
indicatif = "0.17"
ripemd = "0.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
filetime = "0.2"
eframe = "0.28"
winapi = { version = "0.3", features = ["winuser", "wingdi", "winver", "libloaderapi", "winbase", "winerror", "winnt", "processthreadsapi", "handleapi", "synchapi", "fileapi", "ioapiset", "shellapi"] }
rfd = "0.14"
image = "0.25"
open = "5.3"

[build-dependencies]
winres = "0.1"

